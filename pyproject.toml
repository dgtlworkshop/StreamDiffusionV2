

[project]
name = "CausVid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
	"accelerate>=1.13.0",
	"aiohttp>=3.13.3",
	"diffusers>=0.37.0",
	"easydict>=1.13",
	"einops>=0.8.2",
	"fastapi>=0.135.1",
	"flash-attn>=2.7",
	"ftfy>=6.3.1",
	"lmdb>=1.7.5",
	"markdown2>=2.5.5",
	"matplotlib>=3.10.8",
	"moviepy>=2.2.1",
	"numpy>=2.2.6",
	"omegaconf==2.3.0",
	"opencv-python>=4.13.0.92",
	"pandas>=2.3.3",
	"pillow>=11.3.0",
	"pycocotools>=2.0.11",
	"pydantic>=2.12.5",
	"pydub>=0.25.1",
	"requests>=2",
	"scipy>=1.15.3",
	"starlette>=0.52.1",
	"timm>=1.0.25",
	"torch>=2.2",
	"torchaudio",
	"torchvision",
	"tqdm>=4",
	"transformers>=5.3.0",
	"typing-extensions>=4.15.0",
	"uvicorn>=0.41.0",
	"wandb>=0.25.0",
	"websockets>=16.0",
	# Required for flash-attn
	"setuptools",
	"wheel"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["huggingface-hub>=1.6.0", "setuptools-py2cfg>=2.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["causvid*", "streamv2v*"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"

[tool.uv.extra-build-dependencies]
flash-attn = ["packaging", "setuptools", "wheel", "torch", "numpy"]
